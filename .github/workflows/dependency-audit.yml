name: Dependency vulnerability audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  full-audit:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      checkout-submodules: true
      fail-on-vuln: true
      upload-sarif: true
      scan-args: |-
        --lockfile=android/app/gradle.lockfile
        --lockfile=rust/duckyslicer-jni/Cargo.lock
        --lockfile=osv-scanner:osv-scanner-custom.json
