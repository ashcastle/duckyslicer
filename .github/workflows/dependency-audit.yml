name: Dependency vulnerability audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  full-audit:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      checkout-submodules: true
      fail-on-vuln: true
      upload-sarif: true
      scan-args: |-
        --lockfile=android/app/gradle.lockfile
        --lockfile=rust/duckyslicer-jni/Cargo.lock
        --lockfile=osv-scanner:osv-scanner-custom.json
