name: Sign Local Play Bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: SemVer from the local Play metadata
        required: true
        type: string
      version_code:
        description: Play versionCode from the local Play metadata
        required: true
        type: string
      source_commit:
        description: Exact main commit recorded by the local Play metadata
        required: true
        type: string
      transport_tag:
        description: Private draft transport tag, for example play-v0.2.0-5
        required: true
        type: string
      unsigned_asset:
        description: Exact unsigned AAB filename in the private draft
        required: true
        type: string
      unsigned_sha256:
        description: SHA-256 recorded by the local Play metadata
        required: true
        type: string
      release_notes:
        description: English internal-track release notes (1-500 characters)
        required: true
        type: string
      publish_internal:
        description: Publish the signed bundle to the Play internal track
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: play-bundle-${{ inputs.transport_tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLAY_VERSION_NAME: ${{ inputs.version_name }}
      PLAY_VERSION_CODE: ${{ inputs.version_code }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      TRANSPORT_TAG: ${{ inputs.transport_tag }}
      UNSIGNED_ASSET: ${{ inputs.unsigned_asset }}
      UNSIGNED_SHA256: ${{ inputs.unsigned_sha256 }}
      PLAY_RELEASE_NOTES: ${{ inputs.release_notes }}
      PUBLISH_INTERNAL: ${{ inputs.publish_internal }}
    steps:
      - name: Validate local Play identity and private draft
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Play signing must be dispatched from main" >&2
            exit 1
          fi
          if [ "${#PLAY_VERSION_NAME}" -gt 64 ] || \
            [[ ! "$PLAY_VERSION_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "version_name must be SemVer" >&2
            exit 1
          fi
          if [ "${#PLAY_VERSION_CODE}" -gt 10 ] || \
            [[ ! "$PLAY_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || \
            [ "$PLAY_VERSION_CODE" -gt 2100000000 ]; then
            echo "version_code must be between 1 and 2100000000" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [ "$PUBLISH_INTERNAL" != "true" ] && \
            [ "$PUBLISH_INTERNAL" != "false" ]; then
            echo "publish_internal must be a boolean" >&2
            exit 1
          fi
          if [ -z "$PLAY_RELEASE_NOTES" ] || \
            [ "${#PLAY_RELEASE_NOTES}" -gt 500 ]; then
            echo "release_notes must contain 1-500 characters" >&2
            exit 1
          fi
          expected_tag="play-v$PLAY_VERSION_NAME-$PLAY_VERSION_CODE"
          expected_asset="DuckySlicer-$PLAY_VERSION_NAME-play-unsigned.aab"
          if [ "$TRANSPORT_TAG" != "$expected_tag" ]; then
            echo "transport_tag does not match the local Play identity" >&2
            exit 1
          fi
          if [ "$UNSIGNED_ASSET" != "$expected_asset" ]; then
            echo "unsigned_asset does not match the local Play identity" >&2
            exit 1
          fi
          normalized_sha=$(printf '%s' "$UNSIGNED_SHA256" \
            | tr '[:upper:]' '[:lower:]')
          if [[ ! "$normalized_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "unsigned_sha256 must be a SHA-256 digest" >&2
            exit 1
          fi

          tag_commit=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$TRANSPORT_TAG" --jq .sha)
          if [ "$tag_commit" != "$SOURCE_COMMIT" ]; then
            echo "Play transport tag does not match source_commit" >&2
            exit 1
          fi
          release_json=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TRANSPORT_TAG")
          if [ "$(jq -r .draft <<<"$release_json")" != "true" ]; then
            echo "Play transport release must remain a private draft" >&2
            exit 1
          fi
          if [ "$(jq -r .prerelease <<<"$release_json")" != "false" ]; then
            echo "Play transport draft must not be marked as a prerelease" >&2
            exit 1
          fi
          asset_count=$(jq --arg name "$UNSIGNED_ASSET" \
            '[.assets[] | select(.name == $name)] | length' <<<"$release_json")
          total_assets=$(jq '.assets | length' <<<"$release_json")
          if [ "$total_assets" -ne 1 ] || [ "$asset_count" -ne 1 ]; then
            echo "Play transport draft must contain exactly the named unsigned AAB" >&2
            exit 1
          fi

          mkdir -p unsigned
          gh release download "$TRANSPORT_TAG" \
            --pattern "$UNSIGNED_ASSET" --dir unsigned
          unsigned_aab="unsigned/$UNSIGNED_ASSET"
          test -s "$unsigned_aab"
          actual_sha256=$(sha256sum "$unsigned_aab" | awk '{print $1}')
          if [ "$actual_sha256" != "$normalized_sha" ]; then
            echo "Private draft AAB does not match the local SHA-256" >&2
            exit 1
          fi
          if unzip -Z1 "$unsigned_aab" | \
            grep -E '^META-INF/[^/]+\.(RSA|DSA|EC)$' >/dev/null; then
            echo "Local Play input must remain unsigned" >&2
            exit 1
          fi
          unzip -t "$unsigned_aab" >/dev/null
          unzip -Z1 "$unsigned_aab" | grep -Fx 'BundleConfig.pb'
          unzip -Z1 "$unsigned_aab" | \
            grep -Fx 'base/manifest/AndroidManifest.xml'
          cat > expected-native-entries.txt <<'EOF'
          base/lib/arm64-v8a/libandroidx.graphics.path.so
          base/lib/arm64-v8a/libc++_shared.so
          base/lib/arm64-v8a/libduckyslicer.so
          base/lib/arm64-v8a/libprusaslicer-jni.so
          EOF
          unzip -Z1 "$unsigned_aab" | grep '^base/lib/' | sort \
            > actual-native-entries.txt
          diff -u expected-native-entries.txt actual-native-entries.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-play-unsigned-${{ github.run_id }}
          path: unsigned/${{ inputs.unsigned_asset }}
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play
    permissions:
      actions: read
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: duckyslicer-play-unsigned-${{ github.run_id }}
          path: unsigned

      - name: Sign the exact locally built Play bundle
        env:
          DUCKYSLICER_PLAY_KEYSTORE_BASE64: ${{ secrets.DUCKYSLICER_PLAY_KEYSTORE_BASE64 }}
          DUCKYSLICER_PLAY_STORE_PASSWORD: ${{ secrets.DUCKYSLICER_PLAY_STORE_PASSWORD }}
          DUCKYSLICER_PLAY_KEY_ALIAS: ${{ secrets.DUCKYSLICER_PLAY_KEY_ALIAS }}
          DUCKYSLICER_PLAY_KEY_PASSWORD: ${{ secrets.DUCKYSLICER_PLAY_KEY_PASSWORD }}
          DUCKYSLICER_PLAY_CERT_SHA256: ${{ vars.DUCKYSLICER_PLAY_CERT_SHA256 }}
          PLAY_VERSION_NAME: ${{ inputs.version_name }}
          UNSIGNED_ASSET: ${{ inputs.unsigned_asset }}
          UNSIGNED_SHA256: ${{ inputs.unsigned_sha256 }}
        run: |
          set -euo pipefail
          test -n "$DUCKYSLICER_PLAY_KEYSTORE_BASE64"
          test -n "$DUCKYSLICER_PLAY_STORE_PASSWORD"
          test -n "$DUCKYSLICER_PLAY_KEY_ALIAS"
          test -n "$DUCKYSLICER_PLAY_KEY_PASSWORD"
          unsigned_aab="unsigned/$UNSIGNED_ASSET"
          test -s "$unsigned_aab"
          normalized_sha=$(printf '%s' "$UNSIGNED_SHA256" \
            | tr '[:upper:]' '[:lower:]')
          actual_sha256=$(sha256sum "$unsigned_aab" | awk '{print $1}')
          if [ "$actual_sha256" != "$normalized_sha" ]; then
            echo "Signer input differs from the locally verified SHA-256" >&2
            exit 1
          fi
          if unzip -Z1 "$unsigned_aab" | \
            grep -E '^META-INF/[^/]+\.(RSA|DSA|EC)$' >/dev/null; then
            echo "Signer input is already signed" >&2
            exit 1
          fi

          expected_fingerprint=$(printf '%s' "$DUCKYSLICER_PLAY_CERT_SHA256" \
            | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$expected_fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "DUCKYSLICER_PLAY_CERT_SHA256 must be a SHA-256 fingerprint" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/duckyslicer-play-upload.jks"
          cert_file="$RUNNER_TEMP/duckyslicer-play-upload.der"
          trap 'rm -f "$key_file" "$cert_file"' EXIT
          printf '%s' "$DUCKYSLICER_PLAY_KEYSTORE_BASE64" | \
            base64 --decode > "$key_file"
          chmod 600 "$key_file"
          keytool -exportcert \
            -keystore "$key_file" \
            -storepass:env DUCKYSLICER_PLAY_STORE_PASSWORD \
            -alias "$DUCKYSLICER_PLAY_KEY_ALIAS" \
            -file "$cert_file"
          certificate_text=$(openssl x509 -inform DER -in "$cert_file" \
            -noout -text)
          if ! printf '%s\n' "$certificate_text" | \
            grep -q "Public Key Algorithm: rsaEncryption"; then
            echo "Play upload key must use RSA" >&2
            exit 1
          fi
          key_bits=$(printf '%s\n' "$certificate_text" \
            | sed -n 's/.*Public-Key: (\([0-9][0-9]*\) bit).*/\1/p' \
            | head -1)
          if [[ ! "$key_bits" =~ ^[0-9]+$ ]] || [ "$key_bits" -lt 2048 ]; then
            echo "Play upload RSA key must be at least 2048 bits" >&2
            exit 1
          fi
          actual_fingerprint=$(openssl dgst -sha256 "$cert_file" \
            | sed 's/^.*= //')
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "Play upload certificate does not match the pinned fingerprint" >&2
            exit 1
          fi

          mkdir -p signed
          signed_aab="signed/DuckySlicer-$PLAY_VERSION_NAME-play.aab"
          jarsigner \
            -keystore "$key_file" \
            -storepass:env DUCKYSLICER_PLAY_STORE_PASSWORD \
            -keypass:env DUCKYSLICER_PLAY_KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -signedjar "$signed_aab" \
            "$unsigned_aab" \
            "$DUCKYSLICER_PLAY_KEY_ALIAS"
          verify_report="$RUNNER_TEMP/duckyslicer-play-jarsigner.txt"
          jarsigner -verify -strict -verbose -certs \
            -keystore "$key_file" \
            -storepass:env DUCKYSLICER_PLAY_STORE_PASSWORD \
            "$signed_aab" | tee "$verify_report"
          grep -q '^jar verified\.$' "$verify_report"
          if grep -q 'jar is unsigned' "$verify_report"; then
            echo "Signed Play bundle is still unsigned" >&2
            exit 1
          fi
          signature_block_count=$(unzip -Z1 "$signed_aab" | awk \
            '/^META-INF\/[^\/]+\.(RSA|DSA|EC)$/ { count++ } END { print count + 0 }')
          if [ "$signature_block_count" -lt 1 ]; then
            echo "Signed Play bundle has no JAR signature block" >&2
            exit 1
          fi
          bundle_fingerprint=$(keytool -printcert -jarfile "$signed_aab" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 \
            | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if [ "$bundle_fingerprint" != "$expected_fingerprint" ]; then
            echo "Signed Play bundle certificate does not match the upload key" >&2
            exit 1
          fi
          (
            cd signed
            sha256sum "DuckySlicer-$PLAY_VERSION_NAME-play.aab" \
              > "DuckySlicer-$PLAY_VERSION_NAME-play.aab.sha256"
            sha256sum --check \
              "DuckySlicer-$PLAY_VERSION_NAME-play.aab.sha256"
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-play-signed
          path: |
            signed/DuckySlicer-*-play.aab
            signed/DuckySlicer-*-play.aab.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [validate, sign]
    if: ${{ inputs.publish_internal }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: duckyslicer-play-signed
          path: signed

      - name: Validate keyless Play publisher configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.DUCKYSLICER_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.DUCKYSLICER_GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$PLAY_SERVICE_ACCOUNT"
          if [[ ! "$WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
            echo "Play Workload Identity provider has an invalid resource name" >&2
            exit 1
          fi
          if [[ ! "$PLAY_SERVICE_ACCOUNT" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "Play publisher service account has an invalid email" >&2
            exit 1
          fi

      - id: google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.DUCKYSLICER_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DUCKYSLICER_GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
          request_reason: DuckySlicer Play internal release ${{ inputs.version_name }} (${{ inputs.version_code }})

      - name: Publish the exact signed bundle to the internal track
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          PLAY_PACKAGE_NAME: com.ashcastle.duckyslicer
          PLAY_VERSION_NAME: ${{ inputs.version_name }}
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
          PLAY_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          signed_aab="signed/DuckySlicer-$PLAY_VERSION_NAME-play.aab"
          checksum_file="$signed_aab.sha256"
          test -s "$signed_aab"
          test -s "$checksum_file"
          (
            cd signed
            sha256sum --check "DuckySlicer-$PLAY_VERSION_NAME-play.aab.sha256"
          )
          if [ -z "$PLAY_ACCESS_TOKEN" ]; then
            echo "Play publisher did not receive a short-lived access token" >&2
            exit 1
          fi

          api_root="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PLAY_PACKAGE_NAME"
          upload_root="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PLAY_PACKAGE_NAME"
          auth_header="Authorization: Bearer $PLAY_ACCESS_TOKEN"
          edit_id=""
          edit_committed="false"
          cleanup_edit() {
            if [ -n "$edit_id" ] && [ "$edit_committed" != "true" ]; then
              curl --fail-with-body --silent --show-error \
                --request DELETE --header "$auth_header" \
                "$api_root/edits/$edit_id" >/dev/null || true
            fi
          }
          trap cleanup_edit EXIT

          edit_response=$(curl --fail-with-body --silent --show-error \
            --request POST --header "$auth_header" \
            --header 'Content-Type: application/json' --data '{}' \
            "$api_root/edits")
          edit_id=$(jq -er '.id' <<<"$edit_response")
          if [[ ! "$edit_id" =~ ^[0-9]+$ ]]; then
            echo "Play returned an invalid edit identifier" >&2
            exit 1
          fi

          bundles_response=$(curl --fail-with-body --silent --show-error \
            --header "$auth_header" "$api_root/edits/$edit_id/bundles")
          highest_version_code=$(jq -er \
            '[.bundles[]?.versionCode | tonumber] | max // 0' \
            <<<"$bundles_response")
          if [ "$PLAY_VERSION_CODE" -le "$highest_version_code" ]; then
            echo "versionCode $PLAY_VERSION_CODE is not greater than Play's current maximum $highest_version_code" >&2
            exit 1
          fi

          bundle_size=$(wc -c < "$signed_aab" | tr -d '[:space:]')
          if [[ ! "$bundle_size" =~ ^[1-9][0-9]*$ ]]; then
            echo "Signed Play bundle has an invalid byte size" >&2
            exit 1
          fi
          upload_headers="$RUNNER_TEMP/duckyslicer-play-upload.headers"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 20 --max-time 60 \
            --request POST --header "$auth_header" \
            --header 'Content-Type: application/json; charset=UTF-8' \
            --header 'Content-Length: 0' \
            --header 'X-Upload-Content-Type: application/octet-stream' \
            --header "X-Upload-Content-Length: $bundle_size" \
            --dump-header "$upload_headers" --output /dev/null \
            "$upload_root/edits/$edit_id/bundles?uploadType=resumable"
          upload_session=$(awk 'tolower($0) ~ /^location:/ { line=$0; sub(/^[^:]*:[[:space:]]*/, "", line); print line }' \
            "$upload_headers" | tail -1 | tr -d '\r')
          if [[ ! "$upload_session" =~ ^https://androidpublisher\.googleapis\.com/upload/ ]]; then
            echo "Play returned an invalid resumable upload origin" >&2
            exit 1
          fi
          upload_response=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 20 --max-time 300 \
            --request PUT --header "$auth_header" \
            --header 'Content-Type: application/octet-stream' \
            --header "Content-Length: $bundle_size" \
            --data-binary "@$signed_aab" "$upload_session")
          uploaded_version_code=$(jq -er '.versionCode | tostring' \
            <<<"$upload_response")
          if [ "$uploaded_version_code" != "$PLAY_VERSION_CODE" ]; then
            echo "Play uploaded versionCode $uploaded_version_code instead of $PLAY_VERSION_CODE" >&2
            exit 1
          fi

          track_payload=$(jq -n \
            --arg track internal \
            --arg name "$PLAY_VERSION_NAME" \
            --arg version_code "$PLAY_VERSION_CODE" \
            --arg notes "$PLAY_RELEASE_NOTES" \
            '{track: $track, releases: [{name: $name, versionCodes: [$version_code], status: "completed", releaseNotes: [{language: "en-US", text: $notes}]}]}')
          track_response=$(curl --fail-with-body --silent --show-error \
            --request PUT --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data "$track_payload" \
            "$api_root/edits/$edit_id/tracks/internal")
          jq -e --arg version_code "$PLAY_VERSION_CODE" \
            '.track == "internal" and any(.releases[]?.versionCodes[]?; . == $version_code)' \
            <<<"$track_response" >/dev/null

          curl --fail-with-body --silent --show-error \
            --request POST --header "$auth_header" \
            --header 'Content-Type: application/json' --data '{}' \
            "$api_root/edits/$edit_id:validate" >/dev/null
          commit_response=$(curl --fail-with-body --silent --show-error \
            --request POST --header "$auth_header" \
            --header 'Content-Type: application/json' --data '{}' \
            "$api_root/edits/$edit_id:commit?changesInReviewBehavior=ERROR_IF_IN_REVIEW")
          jq -e --arg edit_id "$edit_id" '.id == $edit_id' \
            <<<"$commit_response" >/dev/null
          edit_committed="true"

          {
            echo "### Google Play internal release"
            echo "- Package: $PLAY_PACKAGE_NAME"
            echo "- Version: $PLAY_VERSION_NAME ($PLAY_VERSION_CODE)"
            echo "- Previous maximum versionCode: $highest_version_code"
            echo "- Track: internal"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: [validate, sign, publish]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      TRANSPORT_TAG: ${{ inputs.transport_tag }}
      UNSIGNED_ASSET: ${{ inputs.unsigned_asset }}
      UNSIGNED_SHA256: ${{ inputs.unsigned_sha256 }}
    steps:
      - name: Remove the private draft but retain its source tag
        run: |
          set -euo pipefail
          tag_commit=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$TRANSPORT_TAG" --jq .sha)
          if [ "$tag_commit" != "$SOURCE_COMMIT" ]; then
            echo "Refusing cleanup because the transport tag changed" >&2
            exit 1
          fi
          release_json=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TRANSPORT_TAG")
          if [ "$(jq -r .draft <<<"$release_json")" != "true" ]; then
            echo "Refusing cleanup because the release is not a draft" >&2
            exit 1
          fi
          asset_id=$(jq --arg name "$UNSIGNED_ASSET" \
            -r '.assets[] | select(.name == $name) | .id' <<<"$release_json")
          if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
            echo "Refusing cleanup because the unsigned asset changed" >&2
            exit 1
          fi
          asset_sha=$(gh api \
            -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            | sha256sum | awk '{print $1}')
          normalized_sha=$(printf '%s' "$UNSIGNED_SHA256" \
            | tr '[:upper:]' '[:lower:]')
          if [ "$asset_sha" != "$normalized_sha" ]; then
            echo "Refusing cleanup because the unsigned asset digest changed" >&2
            exit 1
          fi
          gh release delete "$TRANSPORT_TAG" --yes
