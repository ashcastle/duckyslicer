name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    env:
      DUCKYSLICER_NATIVE_JOBS: "4"
      CCACHE_DIR: ${{ github.workspace }}/build/native-slicer/compiler-cache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.91.1
          components: clippy, rustfmt
          targets: aarch64-linux-android

      - name: Initialize Java and Kotlin security analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
          # Keep enough runner memory for the OS and action wrapper. Automatic detection has
          # assigned nearly the full 16 GB runner to CodeQL and twice ended query execution
          # without a diagnostic, while the traced build itself completed successfully.
          ram: 8192
          threads: 2

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install locked native compiler cache
        run: |
          source native/slicer-runtime/ccache.env
          cache_tool_root="$RUNNER_TEMP/duckyslicer-ccache"
          cache_tool_archive="$cache_tool_root/$CCACHE_TOOL_ARCHIVE"
          mkdir -p "$cache_tool_root"
          curl --fail --location --retry 3 --silent --show-error \
            "$CCACHE_TOOL_URL" --output "$cache_tool_archive"
          printf '%s  %s\n' "$CCACHE_TOOL_SHA256" "$cache_tool_archive" | \
            sha256sum --check --strict -
          tar -xf "$cache_tool_archive" -C "$cache_tool_root"
          echo "$cache_tool_root/${CCACHE_TOOL_ARCHIVE%.tar.xz}" >> "$GITHUB_PATH"

      - name: Verify build supply chain
        run: |
          python3 tools/verify_workflows.py
          python3 tools/verify_no_embedded_credentials.py
          python3 tools/verify_gradle_supply_chain.py
          python3 tools/verify_dependency_audit.py
          python3 tools/verify_native_safety.py
          python3 tools/verify_android_isolation.py
          python3 tools/verify_profile_editor.py
          python3 tools/verify_open_source_distribution.py
          python3 tools/verify_runtime_resilience.py
          python3 tools/verify_startup_performance.py
          python3 tools/verify_data_practices.py
          python3 tools/verify_support_diagnostics.py
          python3 tools/verify_project_archive.py
          python3 tools/verify_release_contract.py
          python3 tools/verify_play_bundle_workflow.py
          python3 tools/verify_localization.py
          python3 tools/verify_community_health.py
          python3 tools/verify_store_listing.py
          python3 tools/verify_repository_hygiene.py

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/native-slicer/dependency-sources
            build/native-slicer/dependency-output
          key: android-native-dependencies-v2-${{ runner.os }}-${{ hashFiles('native/slicer-runtime/versions.env', 'native/slicer-runtime/build.sh') }}
          restore-keys: |
            android-native-dependencies-v2-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native-slicer/compiler-cache
          key: android-native-ccache-v1-${{ runner.os }}-${{ hashFiles('native/slicer-runtime/versions.env', 'native/slicer-runtime/build.sh', 'native/slicer-runtime/*.patch', 'native/slicer-runtime/overlay/**/*', 'native/slicer-runtime/ccache.env') }}
          restore-keys: |
            android-native-ccache-v1-${{ runner.os }}-

      - name: Check Rust
        working-directory: rust/duckyslicer-jni
        run: |
          cargo fmt --check
          cargo test --locked
          cargo test --release --locked
          cargo clippy --locked -- -D warnings

      - name: Build, test, lint, and assemble debug APK
        working-directory: android
        run: |
          ccache --zero-stats
          trap 'ccache --show-stats || true' EXIT
          ./gradlew --dependency-verification=strict --no-build-cache \
            :baselineprofile:compileNonMinifiedReleaseKotlin \
            :app:testDebugUnitTest :app:assembleDebug \
            :app:assembleDebugAndroidTest :app:lintDebug \
            :app:writeDebugDependencyInventory

      - name: Analyze Java and Kotlin
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin

      - name: Verify 16 KB debug APK and release policies
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 \
            android/app/build/outputs/apk/debug/app-debug.apk
          python3 -m unittest tools.test_verify_apk tools.test_verify_artifact_manifest tools.test_verify_artifact_localization tools.test_generate_android_translations tools.test_verify_localization tools.test_verify_community_health tools.test_verify_store_listing tools.test_verify_repository_hygiene tools.test_verify_no_embedded_credentials tools.test_verify_gradle_supply_chain tools.test_verify_dependency_audit tools.test_verify_native_safety tools.test_verify_android_isolation tools.test_verify_slice_storage tools.test_verify_preview_boundary tools.test_verify_profile_editor tools.test_verify_profile_option_coverage tools.test_verify_open_source_distribution tools.test_verify_runtime_resilience tools.test_verify_startup_performance tools.test_verify_release_qualifications tools.test_verify_data_practices tools.test_verify_support_diagnostics tools.test_verify_project_archive tools.test_verify_release_contract tools.test_verify_play_bundle_workflow tools.test_prepare_local_release tools.test_prepare_local_play_bundle tools.test_generate_license_inventory tools.test_generate_offline_licenses tools.test_native_license_policy tools.test_generate_profile_catalog tools.test_generate_sbom tools.test_generate_source_bundle tools.test_verify_reproducible_release tools.test_verify_workflows
          python3 tools/verify_slice_storage.py
          python3 tools/verify_preview_boundary.py
          python3 tools/verify_profile_editor.py
          python3 tools/verify_profile_option_coverage.py
          python3 tools/verify_artifact_manifest.py --variant debug \
            android/app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_artifact_localization.py \
            android/app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Generate CycloneDX SBOM
        run: |
          python3 tools/generate_license_inventory.py \
            android/app/build/reports/dependencies/debug.txt \
            android/app/build/reports/dependencies/debug-licenses.json
          python3 tools/generate_sbom.py \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/duckyslicer-debug.cdx.json \
            "${GITHUB_SHA}" \
            android/app/build/reports/dependencies/debug.txt \
            android/app/build/reports/dependencies/debug-licenses.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-debug-sbom
          path: android/app/build/outputs/duckyslicer-debug.cdx.json
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-device-test-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  device-tests:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: duckyslicer-device-test-apks
          path: apks

      - name: Install ARM64 16 KB emulator image
        run: |
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "system-images;android-36;google_apis_ps16k;arm64-v8a"
          echo no | avdmanager create avd \
            --force \
            --name duckyslicer-arm64 \
            --package "system-images;android-36;google_apis_ps16k;arm64-v8a" \
            --device pixel_6

      - name: Start ARM64 16 KB emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd duckyslicer-arm64 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel off \
            > "$RUNNER_TEMP/duckyslicer-emulator.log" 2>&1 &
          adb wait-for-device
          booted=false
          for attempt in {1..300}; do
            if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            cat "$RUNNER_TEMP/duckyslicer-emulator.log"
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Verify ARM64 16 KB device
        run: |
          test "$(uname -m)" = arm64
          test "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = 16384

      - name: Install debug and instrumentation APKs
        run: |
          adb install -r apks/debug/app-debug.apk
          adb install -r apks/androidTest/debug/app-debug-androidTest.apk

      - name: Run bounded instrumented smoke tests
        run: |
          adb shell am instrument -w -r \
            -e class com.ashcastle.duckyslicer.SliceLifecycleInstrumentedTest,com.ashcastle.duckyslicer.AppSettingsLifecycleInstrumentedTest,com.ashcastle.duckyslicer.ProfileLibraryInstrumentedTest,com.ashcastle.duckyslicer.GcodeOpenIntentInstrumentedTest \
            com.ashcastle.duckyslicer.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/duckyslicer-device-smoke.txt"
          grep -q '^OK (' "$RUNNER_TEMP/duckyslicer-device-smoke.txt"

      - name: Run pinned slicer corpus smoke case
        if: github.event_name != 'pull_request'
        run: |
          adb shell am instrument -w -r \
            -e class com.ashcastle.duckyslicer.OrcaQualificationCorpusInstrumentedTest \
            -e corpusCase simple-part \
            com.ashcastle.duckyslicer.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/duckyslicer-device-corpus.txt"
          grep -q '^OK (' "$RUNNER_TEMP/duckyslicer-device-corpus.txt"

      - name: Upload emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-arm64-emulator-log
          path: |
            ${{ runner.temp }}/duckyslicer-emulator.log
            ${{ runner.temp }}/duckyslicer-device-smoke.txt
            ${{ runner.temp }}/duckyslicer-device-corpus.txt
          if-no-files-found: ignore

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
