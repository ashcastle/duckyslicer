name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DUCKYSLICER_NATIVE_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/cache@v5
        with:
          path: |
            build/native-slicer/dependency-sources
            build/native-slicer/build
          key: android-native-${{ runner.os }}-${{ hashFiles('native/slicer-runtime/versions.env', 'native/slicer-runtime/runtime.patch') }}

      - name: Check Rust
        working-directory: rust/duckyslicer-jni
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked -- -D warnings

      - name: Build, test, and lint APK
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug \
            :app:assembleDebugAndroidTest :app:lintDebug \
            :app:writeDebugDependencyInventory

      - name: Verify 16 KB APK packaging
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Generate CycloneDX SBOM
        run: |
          python3 tools/generate_sbom.py \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/duckyslicer-debug.cdx.json \
            "${GITHUB_SHA}" \
            android/app/build/reports/dependencies/debug.txt

      - uses: actions/upload-artifact@v7
        with:
          name: duckyslicer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: duckyslicer-debug-sbom
          path: android/app/build/outputs/duckyslicer-debug.cdx.json
          if-no-files-found: error

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
