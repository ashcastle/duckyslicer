name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    env:
      DUCKYSLICER_NATIVE_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.91.1
          components: clippy, rustfmt
          targets: aarch64-linux-android

      - name: Initialize Java and Kotlin security analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Verify build supply chain
        run: |
          python3 tools/verify_workflows.py
          python3 tools/verify_no_embedded_credentials.py
          python3 tools/verify_gradle_supply_chain.py
          python3 tools/verify_dependency_audit.py
          python3 tools/verify_native_safety.py
          python3 tools/verify_android_isolation.py
          python3 tools/verify_profile_editor.py
          python3 tools/verify_open_source_distribution.py
          python3 tools/verify_runtime_resilience.py
          python3 tools/verify_startup_performance.py
          python3 tools/verify_data_practices.py
          python3 tools/verify_support_diagnostics.py
          python3 tools/verify_project_archive.py
          python3 tools/verify_release_contract.py
          python3 tools/verify_play_bundle_workflow.py
          python3 tools/verify_localization.py
          python3 tools/verify_community_health.py
          python3 tools/verify_store_listing.py
          python3 tools/verify_repository_hygiene.py

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/native-slicer/dependency-sources
            build/native-slicer/build
          key: android-native-${{ runner.os }}-${{ hashFiles('native/slicer-runtime/versions.env', 'native/slicer-runtime/*.patch') }}

      - name: Check Rust
        working-directory: rust/duckyslicer-jni
        run: |
          cargo fmt --check
          cargo test --locked
          cargo test --release --locked
          cargo clippy --locked -- -D warnings

      - name: Build, test, lint, and assemble debug APK
        working-directory: android
        run: |
          ./gradlew --dependency-verification=strict \
            :baselineprofile:compileNonMinifiedReleaseKotlin \
            :app:testDebugUnitTest :app:assembleDebug \
            :app:assembleDebugAndroidTest :app:lintDebug \
            :app:writeDebugDependencyInventory

      - name: Analyze Java and Kotlin
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:java-kotlin

      - name: Verify 16 KB debug APK and release policies
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 \
            android/app/build/outputs/apk/debug/app-debug.apk
          python3 -m unittest tools.test_verify_apk tools.test_verify_artifact_manifest tools.test_verify_artifact_localization tools.test_generate_android_translations tools.test_verify_localization tools.test_verify_community_health tools.test_verify_store_listing tools.test_verify_repository_hygiene tools.test_verify_no_embedded_credentials tools.test_verify_gradle_supply_chain tools.test_verify_dependency_audit tools.test_verify_native_safety tools.test_verify_android_isolation tools.test_verify_slice_storage tools.test_verify_preview_boundary tools.test_verify_profile_editor tools.test_verify_open_source_distribution tools.test_verify_runtime_resilience tools.test_verify_startup_performance tools.test_verify_release_qualifications tools.test_verify_data_practices tools.test_verify_support_diagnostics tools.test_verify_project_archive tools.test_verify_release_contract tools.test_verify_play_bundle_workflow tools.test_prepare_local_release tools.test_prepare_local_play_bundle tools.test_generate_license_inventory tools.test_generate_offline_licenses tools.test_generate_profile_catalog tools.test_generate_sbom tools.test_generate_source_bundle tools.test_verify_reproducible_release tools.test_verify_workflows
          python3 tools/verify_slice_storage.py
          python3 tools/verify_preview_boundary.py
          python3 tools/verify_profile_editor.py
          python3 tools/verify_artifact_manifest.py --variant debug \
            android/app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_artifact_localization.py \
            android/app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Generate CycloneDX SBOM
        run: |
          python3 tools/generate_license_inventory.py \
            android/app/build/reports/dependencies/debug.txt \
            android/app/build/reports/dependencies/debug-licenses.json
          python3 tools/generate_sbom.py \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/duckyslicer-debug.cdx.json \
            "${GITHUB_SHA}" \
            android/app/build/reports/dependencies/debug.txt \
            android/app/build/reports/dependencies/debug-licenses.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-debug-sbom
          path: android/app/build/outputs/duckyslicer-debug.cdx.json
          if-no-files-found: error

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
