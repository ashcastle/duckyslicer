name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DUCKYSLICER_NATIVE_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Verify workflow supply chain
        run: python3 tools/verify_workflows.py

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/native-slicer/dependency-sources
            build/native-slicer/build
          key: android-native-${{ runner.os }}-${{ hashFiles('native/slicer-runtime/versions.env', 'native/slicer-runtime/runtime.patch') }}

      - name: Check Rust
        working-directory: rust/duckyslicer-jni
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked -- -D warnings

      - name: Build, test, and lint APK
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug \
            :app:assembleDebugAndroidTest :app:lintDebug \
            :app:writeDebugDependencyInventory

      - name: Verify 16 KB APK packaging
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 \
            android/app/build/outputs/apk/debug/app-debug.apk
          python3 -m unittest tools.test_verify_apk
          python3 tools/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Generate CycloneDX SBOM
        run: |
          python3 tools/generate_sbom.py \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/duckyslicer-debug.cdx.json \
            "${GITHUB_SHA}" \
            android/app/build/reports/dependencies/debug.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-device-test-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-debug-sbom
          path: android/app/build/outputs/duckyslicer-debug.cdx.json
          if-no-files-found: error

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  device-tests:
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: duckyslicer-device-test-apks
          path: apks

      - name: Install ARM64 emulator image
        run: |
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;arm64-v8a"
          echo no | avdmanager create avd \
            --force \
            --name duckyslicer-arm64 \
            --package "system-images;android-35;google_apis;arm64-v8a" \
            --device pixel_6

      - name: Start ARM64 emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd duckyslicer-arm64 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            > "$RUNNER_TEMP/duckyslicer-emulator.log" 2>&1 &
          adb wait-for-device
          booted=false
          for attempt in {1..180}; do
            if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            cat "$RUNNER_TEMP/duckyslicer-emulator.log"
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run on-device slicing tests
        run: |
          adb install -r apks/debug/app-debug.apk
          adb install -r apks/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -r \
            com.ashcastle.duckyslicer.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/duckyslicer-device-tests.txt"
          grep -q '^OK (' "$RUNNER_TEMP/duckyslicer-device-tests.txt"

      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckyslicer-arm64-emulator-log
          path: |
            ${{ runner.temp }}/duckyslicer-emulator.log
            ${{ runner.temp }}/duckyslicer-device-tests.txt
          if-no-files-found: ignore
