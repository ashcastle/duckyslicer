name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DUCKYSLICER_NATIVE_JOBS: "4"
      DUCKYSLICER_STORE_PASSWORD: ${{ secrets.DUCKYSLICER_STORE_PASSWORD }}
      DUCKYSLICER_KEY_ALIAS: ${{ secrets.DUCKYSLICER_KEY_ALIAS }}
      DUCKYSLICER_KEY_PASSWORD: ${{ secrets.DUCKYSLICER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android build inputs
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Restore native build cache
        uses: actions/cache@v5
        with:
          path: |
            build/native-slicer/dependency-sources
            build/native-slicer/build
          key: android-native-${{ runner.os }}-${{ hashFiles('native/slicer-runtime/versions.env', 'native/slicer-runtime/runtime.patch') }}

      - name: Materialize signing key
        env:
          DUCKYSLICER_KEYSTORE_BASE64: ${{ secrets.DUCKYSLICER_KEYSTORE_BASE64 }}
        run: |
          test -n "$DUCKYSLICER_KEYSTORE_BASE64"
          test -n "$DUCKYSLICER_STORE_PASSWORD"
          test -n "$DUCKYSLICER_KEY_ALIAS"
          test -n "$DUCKYSLICER_KEY_PASSWORD"
          key_file="$RUNNER_TEMP/duckyslicer-release.jks"
          printf '%s' "$DUCKYSLICER_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "DUCKYSLICER_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            :app:writeReleaseDependencyInventory \
            -Pduckyslicer.versionName="$version" \
            -Pduckyslicer.versionCode="${GITHUB_RUN_NUMBER}"

      - name: Verify signing and 16 KB packaging
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"

      - name: Generate CycloneDX SBOM
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 tools/generate_sbom.py \
            android/app/build/outputs/apk/release/app-release.apk \
            "DuckySlicer-$version.cdx.json" \
            "$version" \
            android/app/build/reports/dependencies/release.txt

      - name: Name release APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "DuckySlicer-$version-arm64.apk"

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "DuckySlicer-*"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            DuckySlicer-*-arm64.apk
            DuckySlicer-*.cdx.json
