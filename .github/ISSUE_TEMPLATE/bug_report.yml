name: Bug report
description: Report a reproducible problem in DuckySlicer.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve DuckySlicer. Do not include private models, G-code,
        printer addresses, access keys, personal data, or security exploit details.
        Follow the Security reporting guidance for security or sensitive privacy problems.

  - type: input
    id: version
    attributes:
      label: DuckySlicer version
      description: Use the version shown in Settings or the GitHub Release name.
      placeholder: 0.1.0-alpha.4
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Android device
      description: Manufacturer and model only.
      placeholder: Samsung Galaxy S24
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android version
      placeholder: Android 15
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Model import and Prepare
        - Slicing
        - Preview
        - Printer, filament, or process profiles
        - Device connection or upload
        - Projects and export
        - Settings
        - Installation or startup
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a public or synthetic model if a model is needed.
      placeholder: |
        1. Open...
        2. Choose...
        3. Observe...
    validations:
      required: true

  - type: input
    id: profiles
    attributes:
      label: Selected profiles
      description: Optional printer, nozzle, filament, and process profile names. Do not include an address or access key.
      placeholder: Generic printer · 0.4 mm · Generic PLA · 0.20 mm Standard

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include exact visible wording when useful, but remove private information.
    validations:
      required: true

  - type: textarea
    id: support_details
    attributes:
      label: Optional support details
      description: Paste only the report you explicitly exported from Settings > Help > Save support details.
      render: text

  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshots or safe sample
      description: Attach only public or synthetic content that you have permission to publish.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public report safety
      options:
        - label: I removed private models, private or identifying G-code, printer addresses, access keys, personal data, and security details.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: I reproduced this with the newest available DuckySlicer build.
          required: true
