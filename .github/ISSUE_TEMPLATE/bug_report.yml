name: Bug report
description: Report a reproducible DuckySlicer problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve DuckySlicer. Search existing issues first and
        remove private model data or printer credentials from anything you attach.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing open and closed issues.
          required: true
        - label: I reproduced this with the newest available DuckySlicer build.
          required: true
  - type: input
    id: version
    attributes:
      label: DuckySlicer version
      placeholder: 0.1.0-dev or commit SHA
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Galaxy S24 Ultra, Android 16
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Selected printer, nozzle, and filament profiles
      placeholder: U1, 0.4 mm, PLA
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import …
        2. Select …
        3. Tap …
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: support_details
    attributes:
      label: Support details
      description: Attach the text file from Settings > Help > Save support details after reviewing it.
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots and safe sample files
      description: Attach only files you are permitted to share. Do not post security vulnerabilities here.
    validations:
      required: false
