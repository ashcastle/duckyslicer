name: Feature request
description: Propose a focused improvement to the offline-first Android slicer.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the printing workflow, not private project content. Do not include
        private models, private or identifying G-code, printer addresses, access keys,
        or personal data.

  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: What are you trying to accomplish, and what blocks you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe what the user should see and be able to do.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Model import and Prepare
        - Slicing
        - Preview
        - Printer, filament, or process profiles
        - Device connection or upload
        - Projects and export
        - Settings
        - Other
    validations:
      required: true

  - type: textarea
    id: offline
    attributes:
      label: Offline behavior
      description: Explain how this works without an account or cloud service. If LAN access is needed, explain why.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Optional context
      description: Add a public mockup, reference, or compatibility detail when useful.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public request safety
      options:
        - label: I removed private models, private or identifying G-code, printer addresses, access keys, and personal data.
          required: true
        - label: I searched existing issues for the same request.
          required: true
