name: Feature request
description: Suggest an improvement for DuckySlicer on Android
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the mobile slicing task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested experience
      description: Describe the result from a user's point of view.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Slice
        - Preview
        - Profiles
        - Project
        - Settings
        - Accessibility and localization
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, mockups, or printer/profile details if useful.
    validations:
      required: false
