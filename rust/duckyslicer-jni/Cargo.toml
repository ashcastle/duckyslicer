[package]
name = "duckyslicer-jni"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
build = "build.rs"

[lib]
name = "duckyslicer"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
stl_io = "0.10.0"
thiserror = "2.0.17"

[build-dependencies]
cc = "1.2.41"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
